<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Enciclopedia de Fauna</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card registro-card">
            <div class="login-header">
                <i class="fas fa-seedling logo-icon"></i>
                <h1>Únete a la Expedición</h1>
                <p>Crea tu cuenta para guardar tus animales favoritos.</p>
            </div>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="username">Nombre de Usuario</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Tu apodo de explorador" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirmar</label>
                        <div class="input-field">
                            <i class="fas fa-shield-alt"></i>
                            <input type="password" id="confirm-password" placeholder="••••••••" required>
                        </div>
                    </div>
                </div>

                <div class="terms-container">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">Acepto los <a href="#">Términos de Conservación</a></label>
                </div>

                <button type="submit" class="btn-login btn-registro">Crear Cuenta</button>

                <div class="login-footer">
                    <p>¿Ya eres parte de la comunidad? <a href="login.html">Inicia sesión aquí</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

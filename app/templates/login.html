<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Enciclopedia de Fauna</title>
    <link rel="stylesheet" href="/app/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-leaf logo-icon"></i>
                <h1>WildInfo</h1>
                <p>Bienvenido de nuevo, explorador.</p>
            </div>

            <form action="#" method="POST">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="tu@correo.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-field">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-login">Iniciar Sesión</button>

                <div class="login-footer">
                    <p>¿Aún no tienes cuenta? <a href="registro.html">Regístrate gratis</a></p>
                    <a href="index.html" class="back-home">← Volver al inicio</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
